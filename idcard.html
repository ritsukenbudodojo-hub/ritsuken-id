<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RITSUKEN ID Card</title>
<style>body{margin:0;background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;padding:12px}.card{width:390px;background:#151515;border:2px solid #d4af37;border-radius:20px;overflow:hidden;color:#fff;box-shadow:0 0 30px rgba(212,175,55,0.25)}.head{text-align:center;color:#d4af37;font-weight:900;font-size:19px;padding-top:18px}.sub{font-size:9px;color:#888;text-align:center;margin-top:2px}.photo-wrap{text-align:center;margin:16px 0 6px}.photo-wrap img{width:116px;height:116px;border-radius:50%;border:3px solid #d4af37;object-fit:cover;background:#222}.name{text-align:center;font-size:21px;font-weight:800;margin-top:8px;word-break:break-word;padding:0 10px}.badges{display:flex;justify-content:center;gap:7px;margin:12px 0;flex-wrap:wrap}.badge{padding:6px 14px;border-radius:22px;font-size:11px;font-weight:800}.b-gold{background:#d4af37;color:#000}.b-white{background:#fff;color:#000}.b-green{background:#00c853;color:#fff}.b-red{background:#d50000;color:#fff}.details{padding:14px 16px;font-size:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #252525;padding:9px 0;gap:10px}.label{color:#d4af37;font-size:9px;font-weight:800;min-width:55px}.val{color:#fff;text-align:right;max-width:62%;text-transform:uppercase;font-size:11.5px;word-break:break-word;overflow-wrap:anywhere}.full{padding:9px 0;border-bottom:1px solid #252525;word-break:break-word;overflow-wrap:anywhere}.note-box{margin-top:12px;border:1px solid #ff1744;background:rgba(255,23,68,0.1);color:#ff8a80;padding:8px 10px;border-radius:8px;font-size:11px}.footer{text-align:center;color:#555;font-size:8.5px;margin:16px 0 14px;word-break:break-word}#loading{text-align:center;color:#d4af37;padding:60px 20px}</style>
</head>
<body>
<div id="loading">Loading ID Card...<br><small id="idShow"></small></div>
<div id="cardBox" style="display:none"></div>
<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdFtbLzB2G1bv9-Sz4sBhLfvr3IepGp_lTDFegHkPPgYmi4zG7dgdZgk53NmVxSeDB_cn4mri5ke5q/pub?gid=0&single=true&output=csv";
function getParam(n){return new URLSearchParams(window.location.search).get(n);}
function fixPhoto(url){if(!url)return"https://via.placeholder.com/116?text=No+Photo";let fid="";url=String(url).trim();if(url.includes("id="))fid=url.split("id=")[1].split("&")[0];else if(url.includes("/d/"))fid=url.split("/d/")[1].split("/")[0];else if(url.length>15&&!url.includes("http"))fid=url;if(fid)return"https://drive.google.com/thumbnail?id="+fid+"&sz=w500";return url;}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function parseCSV(text){const rows=[];let curRow=[];let cur='';let inQ=false;for(let i=0;i<text.length;i++){const c=text[i];if(c=='"'){if(inQ&&text[i+1]=='"'){cur+='"';i++;}else inQ=!inQ;}else if(c==','&&!inQ){curRow.push(cur);cur='';}else if((c=='\n'||c=='\r')&&!inQ){if(cur!==''||curRow.length>0){curRow.push(cur);rows.push(curRow);curRow=[];cur='';}if(c=='\r'&&text[i+1]=='\n')i++;}else cur+=c;}if(cur!==''||curRow.length>0){curRow.push(cur);rows.push(curRow);}return rows;}
async function load(){const id=getParam('id');document.getElementById('idShow').innerText=id?"ID: "+id:"";if(!id){document.getElementById('loading').innerHTML="ID Missing<br><small>Add ?id=ASC2024/11</small>";return;}try{const res=await fetch(SHEET_CSV_URL);const text=await res.text();const rows=parseCSV(text);const heads=rows[0].map(h=>h.toLowerCase().trim());const findCol=k=>{for(let key of k){let i=heads.findIndex(h=>h.includes(key.toLowerCase()));if(i!=-1)return i}return -1};const C={id:findCol(['member id']),name:findCol(['name']),guardian:findCol(['guardian']),dob:findCol(['dob']),gender:findCol(['gender']),address:findCol(['address']),blood:findCol(['blood']),medical:findCol(['medical']),org:findCol(['organization']),rank:findCol(['last rank']),photo:findCol(['photo']),join:findCol(['join date']),fees:findCol(['fees status']),out:findCol(['outstanding']),note:findCol(['note']),active:findCol(['active'])};let found=null;for(let i=1;i<rows.length;i++){const cell=rows[i][C.id]||"";if(String(cell).trim().toLowerCase()===String(id).trim().toLowerCase()){found=rows[i];break;}}if(!found){document.getElementById('loading').innerHTML="ID Not Found: "+esc(id);return;}const isActive=C.active==-1?true:String(found[C.active]||"").toLowerCase().includes('active');const noteVal=C.note>-1?found[C.note]:"";const html=`<div class="card"><div class="head">RITSUKEN BUDO DOJO</div><div class="sub">SHUBUKAN INDIA - OFFICIAL MEMBER</div><div class="photo-wrap"><img src="${fixPhoto(found[C.photo])}" onerror="this.src='https://via.placeholder.com/116?text=No+Photo'"></div><div class="name">${esc(found[C.name])}</div><div class="badges"><span class="badge b-gold">${esc(found[C.id])}</span><span class="badge b-white">${esc(found[C.rank]||'N/A')}</span><span class="badge ${isActive?'b-green':'b-red'}">${isActive?'ACTIVE':'INACTIVE'}</span></div><div class="details"><div class="row"><span class="label">GUARDIAN</span><span class="val">${esc(found[C.guardian]||'N/A')}</span></div><div class="row"><span class="label">DOB</span><span class="val">${esc(found[C.dob]||'N/A')}</span></div><div class="row"><span class="label">GENDER</span><span class="val">${esc(found[C.gender]||'N/A')}</span></div><div class="row"><span class="label">BLOOD</span><span class="val">${esc(found[C.blood]||'N/A')}</span></div><div class="row"><span class="label">MEDICAL</span><span class="val">${esc(found[C.medical]||'NIL')}</span></div><div class="full"><div class="label">FULL ADDRESS</div><div>${esc(found[C.address]||'N/A')}</div></div><div class="full"><div class="label">LAST ORGANIZATION</div><div>${esc(found[C.org]||'N/A')}</div></div><div class="full"><div class="label">LAST RANK</div><div style="font-weight:800">${esc(found[C.rank]||'N/A')}</div></div><div class="row"><span class="label">JOIN DATE</span><span class="val">${esc(found[C.join]||'N/A')}</span></div><div class="row"><span class="label">FEES</span><span class="val">${esc(found[C.fees]||'N/A')}</span></div><div class="row"><span class="label">OUTSTANDING</span><span class="val">${esc(found[C.out]||'N/A')}</span></div>${noteVal?`<div class="note-box"><b>NOTE:</b> ${esc(noteVal)}</div>`:''}<div class="footer">Scan Verified | Ritsuken Budo Dojo Family<br>${esc(found[C.id])} | ${esc(found[C.name])}</div></div></div>`;document.getElementById('loading').style.display='none';document.getElementById('cardBox').style.display='flex';document.getElementById('cardBox').style.justifyContent='center';document.getElementById('cardBox').innerHTML=html;}catch(e){document.getElementById('loading').innerHTML="Error: "+esc(e.message);}}load();
</script>
</body>
</html>
